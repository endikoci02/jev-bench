instructions: Which intent best describes this online-banking customer message?
labels:
  activate_my_card: Wants to activate a newly received card.
  age_limit: Asks about the minimum age to open or use an account.
  apple_pay_or_google_pay: Asks about using Apple Pay or Google Pay.
  atm_support: Asks which ATMs can be used or about ATM support.
  automatic_top_up: Asks about setting up or how automatic top-ups work.
  balance_not_updated_after_bank_transfer: Balance has not updated after a bank transfer.
  balance_not_updated_after_cheque_or_cash_deposit: Balance has not updated after depositing a cheque or cash.
  beneficiary_not_allowed: Cannot add a beneficiary or the beneficiary is not allowed.
  cancel_transfer: Wants to cancel a transfer.
  card_about_to_expire: Card is about to expire; asks about renewal.
  card_acceptance: Asks where or whether the card is accepted.
  card_arrival: Has not yet received an ordered card or asks when it will arrive.
  card_delivery_estimate: Asks how long card delivery takes.
  card_linking: Wants to link a card to the account or app.
  card_not_working: Card is not working (general).
  card_payment_fee_charged: Was charged a fee for a card payment.
  card_payment_not_recognised: Does not recognise a card payment on the statement.
  card_payment_wrong_exchange_rate: A card payment used a wrong exchange rate.
  card_swallowed: An ATM kept or swallowed the card.
  cash_withdrawal_charge: Was charged a fee for a cash withdrawal.
  cash_withdrawal_not_recognised: Does not recognise a cash withdrawal.
  change_pin: Wants to change the card PIN.
  compromised_card: Thinks the card has been compromised or used fraudulently.
  contactless_not_working: Contactless payment is not working.
  country_support: Asks which countries are supported.
  declined_card_payment: A card payment was declined.
  declined_cash_withdrawal: A cash withdrawal was declined.
  declined_transfer: A transfer was declined.
  direct_debit_payment_not_recognised: Does not recognise a direct debit payment.
  disposable_card_limits: Asks about limits on disposable virtual cards.
  edit_personal_details: Wants to change personal details such as name or address.
  exchange_charge: Asks about fees for currency exchange.
  exchange_rate: Asks what exchange rate is used or how it is set.
  exchange_via_app: Wants to exchange currency in the app.
  extra_charge_on_statement: Sees an unexpected extra charge on the statement.
  failed_transfer: A transfer failed.
  fiat_currency_support: Asks which fiat currencies are supported.
  get_disposable_virtual_card: Wants to get a disposable virtual card.
  get_physical_card: Wants to get a physical card.
  getting_spare_card: Wants an additional or spare card.
  getting_virtual_card: Wants to get a virtual card.
  lost_or_stolen_card: Card was lost or stolen.
  lost_or_stolen_phone: Phone was lost or stolen.
  order_physical_card: Wants to order a physical card.
  passcode_forgotten: Forgot the app passcode.
  pending_card_payment: A card payment is still pending.
  pending_cash_withdrawal: A cash withdrawal is still pending.
  pending_top_up: A top-up is still pending.
  pending_transfer: A transfer is still pending.
  pin_blocked: The PIN is blocked.
  receiving_money: Asks how to receive money into the account.
  Refund_not_showing_up: A refund has not shown up in the account.
  request_refund: Wants to request a refund.
  reverted_card_payment?: A card payment was reverted.
  supported_cards_and_currencies: Asks which cards and currencies are supported.
  terminate_account: Wants to close the account.
  top_up_by_bank_transfer_charge: Asks about fees for topping up by bank transfer.
  top_up_by_card_charge: Asks about fees for topping up by card.
  top_up_by_cash_or_cheque: Wants to top up with cash or a cheque.
  top_up_failed: A top-up failed.
  top_up_limits: Asks about top-up limits.
  top_up_reverted: A top-up was reverted.
  topping_up_by_card: Asks how to top up using a card.
  transaction_charged_twice: A transaction was charged twice.
  transfer_fee_charged: Was charged a fee for a transfer.
  transfer_into_account: Wants to transfer money into the account.
  transfer_not_received_by_recipient: The recipient has not received a transfer.
  transfer_timing: Asks how long a transfer takes.
  unable_to_verify_identity: Cannot complete identity verification.
  verify_my_identity: Asks how to verify identity.
  verify_source_of_funds: Asks about verifying the source of funds.
  verify_top_up: Asks about verifying a top-up.
  virtual_card_not_working: Virtual card is not working.
  visa_or_mastercard: Asks whether the card is Visa or Mastercard.
  why_verify_identity: Asks why identity verification is needed.
  wrong_amount_of_cash_received: Received the wrong amount of cash from an ATM.
  wrong_exchange_rate_for_cash_withdrawal: A cash withdrawal used a wrong exchange rate.
